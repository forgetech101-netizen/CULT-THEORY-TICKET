<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Ticket System</title>
<style>
:root{--bg:#f6f5f2;--fg:#1b1b1f;--mut:#6b6b73;--card:#fff;--bd:#e2e0d9;--acc:#5b3df5;--accfg:#fff;--ok:#12803c;--okbg:#dff5e6;--warn:#9a5b00;--warnbg:#fff0cf;--bad:#b3261e;--badbg:#fde4e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#f2f1ee;--mut:#9c9ca6;--card:#1c1c20;--bd:#2d2d34;--acc:#8b74ff;--accfg:#12121a;--ok:#6fdc96;--okbg:#12301d;--warn:#ffc252;--warnbg:#36280c;--bad:#ff8a80;--badbg:#3a1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--fg:#f2f1ee;--mut:#9c9ca6;--card:#1c1c20;--bd:#2d2d34;--acc:#8b74ff;--accfg:#12121a;--ok:#6fdc96;--okbg:#12301d;--warn:#ffc252;--warnbg:#36280c;--bad:#ff8a80;--badbg:#3a1714;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.pill.in{background:var(--okbg);color:var(--ok)}.pill.out{background:var(--warnbg);color:var(--warn)}
.tk{text-align:center}.tk canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd)}
.tk .id{font:700 14px ui-monospace,monospace;letter-spacing:1px;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
video{width:100%;max-height:340px;background:#000;border-radius:12px;object-fit:cover}
.res{border-radius:14px;padding:18px;text-align:center;margin-top:12px;font-weight:700}
.res h2{margin:0 0 4px;font-size:24px}.res p{margin:0;font-weight:500}
.res.ok{background:var(--okbg);color:var(--ok)}.res.warn{background:var(--warnbg);color:var(--warn)}.res.bad{background:var(--badbg);color:var(--bad)}
.note{font-size:13px;color:var(--mut)}
.msg{background:var(--badbg);color:var(--bad);padding:10px;border-radius:10px;margin-bottom:12px;display:none}
[hidden]{display:none!important}
.wrap{max-width:720px;padding:20px 16px}
h1{font-size:18px;font-weight:700;letter-spacing:.2px;margin:6px 0 14px}
.tabs{gap:0;border:1px solid var(--bd);border-radius:10px;padding:3px;background:var(--card)}
.tabs button{border:0;background:transparent;color:var(--mut);padding:8px 6px;font-size:14px;border-radius:8px}
.tabs button.on{background:var(--fg);color:var(--bg)}
.card{border-radius:12px;padding:14px}
label{font-size:12px;margin:0 0 4px}
input,textarea{padding:9px 10px;font-size:15px;border-radius:8px}
.btn{padding:10px 14px;border-radius:8px;font-size:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .full{grid-column:1/-1}
.f .end{align-self:end}
.f .end .btn{width:100%}
details{margin-top:12px}
summary{cursor:pointer;color:var(--mut);font-size:13px}
details textarea{margin:8px 0 6px}
@media (max-width:420px){.f{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>SWA-DESI Tickets</h1>
<div id="msg" class="msg"></div>
<div id="login" class="card" hidden>
<div class="f">
<div class="full"><label>Staff email</label><input id="le" type="email" autocomplete="username"></div>
<div class="full"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
<div class="full"><button class="btn" id="li" style="width:100%">Sign in</button></div>
</div>
<p class="note" id="lErr" style="color:var(--bad);margin:8px 0 0"></p>
</div>
<div id="app" hidden>
<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn ghost" id="so">Sign out</button></div>
<div class="tabs">
<button data-t="issue" class="on">Issue</button>
<button data-t="guests">Guests</button>
<button data-t="scan">Scan entry</button>
</div>

<section id="issue">
<div class="card">
<div class="f">
<div><label>Name</label><input id="n" autocomplete="off"></div>
<div><label>Phone</label><input id="p" inputmode="tel" autocomplete="off"></div>
<div class="full"><label>Email</label><input id="e" inputmode="email" autocomplete="off"></div>
<div><label>Tickets</label><input id="q" type="number" min="1" max="20" value="1"></div>
<div class="end"><button class="btn" id="go">Create ticket</button></div>
</div>
<p class="note" id="iErr" style="color:var(--bad);margin:8px 0 0"></p>
<details>
<summary>Fill from a pasted message</summary>
<textarea id="aiT" rows="2" placeholder="Paste the buyer’s WhatsApp message here"></textarea>
<button class="btn ghost" id="ai">Auto-fill</button>
</details>
</div>
<div class="grid" id="out"></div>
</section>

<section id="guests" hidden>
<div class="stats"><div class="stat"><b id="sT">0</b><span>Sold</span></div><div class="stat"><b id="sI">0</b><span>Entered</span></div><div class="stat"><b id="sR">0</b><span>Remaining</span></div></div>
<div class="row" style="margin-bottom:10px"><input id="s" placeholder="Search name, phone, email" style="flex:1"><button class="btn ghost" id="csv">Export CSV</button></div>
<div class="card scroll"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Ticket</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</section>

<section id="scan" hidden>
<div class="card">
<video id="v" playsinline muted hidden></video>
<div class="row" style="margin-top:8px"><button class="btn" id="cam">Start camera</button><button class="btn ghost" id="stop" hidden>Stop</button></div>
<label>Camera not working? Type the ticket ID</label>
<div class="row"><input id="man" placeholder="Ticket code" style="flex:1"><button class="btn ghost" id="chk">Check</button></div>
<div id="res"></div>
</div>
</section>
</div>
<p class="note">Every QR holds a random secret code that exists only in this database, so a copied or invented ticket is rejected, and a ticket works only once.</p>
</div>

var tImg=new Image(),tReady=new Promise(function(r){tImg.onload=r;tImg.onerror=r});tImg.src=TICKET_SRC;
function fitText(x,txt,px,y,maxw){var s=17;x.font='600 '+s+'px system-ui,Arial,sans-serif';while(s>9&&x.measureText(txt).width>maxw){s--;x.font='600 '+s+'px system-ui,Arial,sans-serif'}x.fillText(txt,px,y)}
function ticketCanvas(t){
  var c=document.createElement('canvas');c.width=1568;c.height=508;
  tReady.then(function(){
    var x=c.getContext('2d');x.drawImage(tImg,0,0,1568,508);
    x.textBaseline='middle';x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=3;
    fitText(x,t.name,944,350,222);fitText(x,t.phone,944,374,222);fitText(x,t.email,944,399,222);
    x.shadowBlur=0;
    var q=qrCanvas('TKT:'+t.id,600);x.drawImage(q,1245,96,300,300);
    x.fillStyle='#e6e4de';x.textAlign='center';x.font='700 20px ui-monospace,Menlo,monospace';x.fillText(sid(t.id),1395,428);
    x.font='600 13px system-ui,Arial,sans-serif';x.fillText('SCAN AT ENTRY · ONE TIME USE',1395,454);
  });
  return c;
}
function card(t){
  var d=document.createElement('div');d.className='card tk';
  var c=ticketCanvas(t);d.appendChild(c);
  d.insertAdjacentHTML('beforeend','<div class="id">'+esc(t.name)+' · '+sid(t.id)+'</div>');
  var b=document.createElement('button');b.className='btn';b.textContent='Download ticket';
  b.onclick=function(){
    if(!dl){err('Download is not available here. Press and hold the ticket to save it.');return}
    c.toBlob(function(bl){dl.save({filename:'ticket-'+t.name.replace(/[^\w]+/g,'-')+'-'+sid(t.id)+'.png',data:bl}).catch(function(){})});
  };
  d.appendChild(b);return d;
}
$('#ai').onclick=function(){
  var t=$('#aiT').value,em=t.match(/[\w.+-]+@[\w-]+\.[\w.-]+/),rest=t.replace(em?em[0]:'',' ');
  var ph=rest.match(/(?:\+?\d[\s-]?){8,14}/);if(ph)rest=rest.replace(ph[0],' ');
  if(em)$('#e').value=em[0];if(ph)$('#p').value=ph[0].trim();
  var nm=rest.replace(/\b(hi|hello|my|name|is|this|phone|email|mail|number|no|tickets?)\b/ig,' ').replace(/[^A-Za-z ]/g,' ').replace(/\s+/g,' ').trim();
  if(nm)$('#n').value=nm.split(' ').slice(0,3).join(' ');
};
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  ['issue','guests','scan'].forEach(function(id){$('#'+id).hidden=id!==b.dataset.t});
  if(b.dataset.t!=='scan')stopCam();
}});
$('#go').onclick=async function(){
  $('#iErr').textContent='';
  var n=$('#n').value.trim(),p=$('#p').value.trim(),e=$('#e').value.trim(),q=Math.max(1,Math.min(20,parseInt($('#q').value)||1));
  if(!n||p.replace(/\D/g,'').length<7||!/^\S+@\S+\.\S+$/.test(e)){$('#iErr').textContent='Enter a name, a valid phone number and a valid email.';return}
  if(!db){$('#iErr').textContent='Database is not connected.';return}
  var btn=$('#go');btn.disabled=true;$('#out').innerHTML='';
  try{
    for(var i=0;i<q;i++){
      var t={id:token(),name:n,phone:p,email:e,createdAt:Date.now(),used:false};
      await db.doc('tickets/'+t.id).set({name:n,phone:p,email:e,createdAt:t.createdAt,used:false});
      $('#out').appendChild(card(t));
    }
    $('#n').value=$('#p').value=$('#e').value='';$('#q').value=1;
  }catch(x){$('#iErr').textContent='Could not save: '+(x&&x.message||x)+'. Check your internet and login.'}
  btn.disabled=false;
};
function renderGuests(){
  var f=$('#s').value.trim().toLowerCase();
  var used=tickets.filter(function(t){return t.used}).length;
  $('#sT').textContent=tickets.length;$('#sI').textContent=used;$('#sR').textContent=tickets.length-used;
  var list=tickets.filter(function(t){return !f||(t.name+' '+t.phone+' '+t.email+' '+sid(t.id)).toLowerCase().indexOf(f)>-1});
  $('#rows').innerHTML=list.map(function(t){
    return '<tr><td>'+esc(t.name)+'</td><td>'+esc(t.phone)+'</td><td>'+esc(t.email)+'</td><td>'+sid(t.id)+'</td><td><span class="pill '+(t.used?'in':'out')+'">'+(t.used?'Entered '+fmt(t.usedAt):'Not entered')+'</span></td><td><button class="btn ghost" data-id="'+t.id+'">QR</button></td></tr>';
  }).join('')||'<tr><td colspan="6" class="note">No tickets yet.</td></tr>';
  document.querySelectorAll('#rows button').forEach(function(b){b.onclick=function(){
    var t=tickets.filter(function(x){return x.id===b.dataset.id})[0];
    document.querySelector('[data-t=issue]').click();$('#out').innerHTML='';$('#out').appendChild(card(t));
  }});
}
$('#s').oninput=renderGuests;
$('#csv').onclick=function(){
  if(!dl){err('Download is not available here.');return}
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
  var rows=[['Ticket','Name','Phone','Email','Bought','Entered']].concat(tickets.map(function(t){return [sid(t.id),t.name,t.phone,t.email,fmt(t.createdAt),t.used?fmt(t.usedAt):'']}));
  dl.save({filename:'guest-list.csv',data:rows.map(function(r){return r.map(q).join(',')}).join('\n')}).catch(function(){});
};
function show(kind,h,p){
  $('#res').innerHTML='<div class="res '+kind+'"><h2>'+h+'</h2><p>'+esc(p)+'</p></div>';
  try{navigator.vibrate&&navigator.vibrate(kind==='ok'?80:[120,60,120])}catch(x){}
}
async function check(raw){
  var t=String(raw).trim().replace(/^TKT:/i,'').toLowerCase();
  if(!/^[a-z0-9]{6,20}$/.test(t)){show('bad','FAKE / INVALID','This is not one of our tickets.');return}
  if(!db){show('bad','NO CONNECTION','Database is not connected.');return}
  try{
    var ref=db.doc('tickets/'+t);
    var r=await db.runTransaction(async function(tx){
      var s=await tx.get(ref);if(!s.exists)return {k:'x'};
      var d=s.data();if(d.used)return {k:'u',d:d};
      tx.update(ref,{used:true,usedAt:Date.now()});return {k:'v',d:d};
    });
    if(r.k==='x'){show('bad','FAKE / INVALID','Not found in the system.');return}
    if(r.k==='u'){show('warn','ALREADY USED',r.d.name+' entered at '+fmt(r.d.usedAt));return}
    show('ok','VALID: LET IN',r.d.name+' - '+r.d.phone);
  }catch(x){show('bad','ERROR','Could not check: '+(x&&x.message||x)+'. Check your internet and login.')}
}
$('#chk').onclick=function(){var v=$('#man').value;if(v){check(v);$('#man').value=''}};
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    var v=$('#v');v.srcObject=stream;v.hidden=false;await v.play();
    $('#cam').hidden=true;$('#stop').hidden=false;loop();
  }catch(x){err('Camera is blocked here. Use the ticket code box below, or open this page in a browser that allows camera access.')}
}
function loop(){
  var v=$('#v');
  if(!stream)return;
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    var c=loop.c||(loop.c=document.createElement('canvas')),x=c.getContext('2d',{willReadFrequently:true});
    c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
    var r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
    if(r&&r.data&&(r.data!==last.c||Date.now()-last.t>4000)){last={c:r.data,t:Date.now()};check(r.data)}
  }
  raf=requestAnimationFrame(loop);
}
function stopCam(){
  cancelAnimationFrame(raf);
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  $('#v').hidden=true;$('#cam').hidden=false;$('#stop').hidden=true;
}
$('#cam').onclick=startCam;$('#stop').onclick=stopCam;
(function(){
  if(!window.firebase||FIREBASE_CONFIG.apiKey.indexOf('PASTE')===0){$('#login').hidden=true;err('Firebase is not set up yet. Open this file in a text editor and paste your Firebase config at the top of the script (see SETUP.md).');return}
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth=firebase.auth(),unsub=null;db=firebase.firestore();
  dl={save:function(o){var bl=o.data instanceof Blob?o.data:new Blob([o.data],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}};
  auth.onAuthStateChanged(function(u){
    $('#login').hidden=!!u;$('#app').hidden=!u;
    if(unsub){unsub();unsub=null}
    if(!u){stopCam();tickets=[];return}
    err('');
    unsub=db.collection('tickets').orderBy('createdAt','desc').onSnapshot(function(s){
      tickets=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});renderGuests();
    },function(e){err('Cannot read tickets: '+(e&&e.message||e))});
  });
  $('#li').onclick=function(){
    $('#lErr').textContent='';
    auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).catch(function(){$('#lErr').textContent='Wrong email or password.'});
  };
  $('#so').onclick=function(){auth.signOut()};
})();
</script>
</body>
</html>
